name: Validate distribution package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate distribution manifests
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m unittest discover -s tests -v
      - name: Validate Agent Skills discovery
        run: npx --yes skills@1.5.23 add . --list
